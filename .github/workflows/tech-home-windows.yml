name: Windows build
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish this build as a public GitHub release
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web application
        run: pnpm nx build web --skip-nx-cache
      - name: Build Electron backend
        run: pnpm nx build electron-backend --configuration=production
        env:
          IPTVNATOR_REQUIRE_EMBEDDED_MPV: '0'
      - name: Package installer
        run: pnpm run make:app -- --publishPolicy=never
      - uses: actions/upload-artifact@v7
        with:
          name: TechHomeTV-windows
          path: dist/executables/*-setup.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = Get-ChildItem dist/executables -File | Where-Object { $_.Name -like '*-setup.exe' -or $_.Name -eq 'latest.yml' -or $_.Name -like '*.blockmap' }
          if (-not ($assets.Name -contains 'latest.yml')) { throw 'Electron update metadata latest.yml was not generated; refusing to publish a Windows release that cannot update safely.' }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release create "windows-v$version-$env:GITHUB_RUN_NUMBER" @assetPaths --target $env:GITHUB_SHA --title "Tech Home TV Windows $version (build $env:GITHUB_RUN_NUMBER)" --notes "Tech Home TV for Windows. Add your own legal IPTV sources."

