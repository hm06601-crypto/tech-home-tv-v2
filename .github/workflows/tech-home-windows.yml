name: Windows build
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish this build as a public GitHub release
        type: boolean
        default: true
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web application
        run: pnpm nx build web --skip-nx-cache
      - name: Build Electron backend
        run: pnpm nx build electron-backend --configuration=production
        env:
          IPTVNATOR_REQUIRE_EMBEDDED_MPV: '0'
      - name: Package installer
        run: pnpm run make:app -- --publishPolicy=never
      - uses: actions/upload-artifact@v4
        with:
          name: TechHomeTV-windows
          path: dist/executables/*-setup.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "windows-v1.0.0-$env:GITHUB_RUN_NUMBER" dist/executables/*-setup.exe --title "Tech Home TV Windows 1.0.0 (build $env:GITHUB_RUN_NUMBER)" --notes "Tech Home TV for Windows. Add your own legal IPTV sources."
