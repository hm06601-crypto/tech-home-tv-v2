<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <title>Tech Home TV</title>
        <base href="/" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src https://www.youtube-nocookie.com; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' http: https: file: data: blob:; font-src 'self' data:; media-src 'self' http: https: file: data: blob:; connect-src 'self' http: https: ws: wss: blob: data:; worker-src 'self' blob:"
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Tech Home TV" />
        <meta property="og:url" content="https://techhome.ct.ws" />
        <meta
            property="og:image"
            content="https://techhome.ct.ws/assets/icons/android-chrome-512x512.png"
        />
        <meta
            property="og:description"
            content="Tech Home TV — مشغل IPTV لقوائمك الخاصة على Windows وAndroid."
        />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
        <script src="assets/app-config.js" defer></script>
        <style>
            /* Asset-free splash while bundles load; main.ts removes it after bootstrap. */
            #initial-splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                background: #1f1f23;
                color: #f5f5f7;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    'Helvetica Neue', Arial, sans-serif;
                z-index: 99999;
            }
            #initial-splash .splash-logo {
                display: block;
                width: min(78vw, 420px);
                max-height: 150px;
                object-fit: contain;
            }
            #initial-splash .splash-spinner {
                width: 28px;
                height: 28px;
                border: 3px solid rgba(255, 255, 255, 0.12);
                border-top-color: rgba(255, 255, 255, 0.7);
                border-radius: 50%;
                animation: initial-splash-spin 0.9s linear infinite;
            }
            @keyframes initial-splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #initial-splash .splash-spinner {
                    animation: none;
                    opacity: 0.6;
                }
            }
        </style>
    </head>
    <body class="mat-app-background">
        <div id="initial-splash" role="status" aria-label="Loading Tech Home TV">
            <img
                class="splash-logo"
                src="assets/images/tech-home-tv-logo.png"
                alt="Tech Home TV"
            />
            <span class="splash-spinner" aria-hidden="true"></span>
        </div>
        <app-root></app-root>
    </body>
</html>
